<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="hl-token" content="__HL_TOKEN__">
<title>Hardware Live</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="app-header">
  <h1>Hardware Live</h1>
  <span id="connection-pill" class="pill" role="status" aria-live="polite">connecting&hellip;</span>
  <div class="header-actions">
    <label class="sr-only" for="preset-select">Preset</label>
    <select id="preset-select" class="preset-select" aria-label="Active preset"></select>
    <div class="temperature-toggle" role="group" aria-label="Temperature unit">
      <button type="button" id="temperature-c" class="btn" aria-pressed="true">&deg;C</button>
      <button type="button" id="temperature-f" class="btn" aria-pressed="false">&deg;F</button>
    </div>
    <button type="button" id="preset-menu-toggle" class="btn" aria-expanded="false" aria-controls="preset-menu">Preset menu</button>
    <button type="button" id="edit-toggle" class="btn" aria-pressed="false">Edit layout</button>
    <button type="button" id="add-widget-btn" class="btn" hidden>Add widget&hellip;</button>
  </div>
</header>

<div id="preset-menu" class="preset-menu" hidden>
  <button type="button" id="preset-save-new" class="btn">Save as new</button>
  <button type="button" id="preset-rename" class="btn">Rename</button>
  <button type="button" id="preset-duplicate" class="btn">Duplicate</button>
  <button type="button" id="preset-delete" class="btn">Delete</button>
  <button type="button" id="preset-export" class="btn">Export</button>
  <button type="button" id="preset-import" class="btn">Import</button>
  <input id="preset-import-file" type="file" accept="application/json,.json" hidden>
</div>

<div id="connection-banner" class="banner" role="alert" hidden></div>
<div id="unavailable-banner" class="banner banner-info" role="status" hidden></div>
<div id="fps-disabled-banner" class="banner banner-info" role="status" hidden></div>
<div id="preset-status" class="banner banner-info" role="status" hidden></div>

<nav id="quick-filter-bar" class="quick-filter-bar" aria-label="Quick filters"></nav>

<main id="main">
  <div id="widget-grid" class="widget-grid" role="list" aria-label="Hardware widgets"></div>
  <p id="empty-state" class="empty-state" hidden>No widgets to show. Turn on Edit layout to add one.</p>
</main>

<div id="reorder-live" class="sr-only" role="status" aria-live="assertive"></div>

<dialog id="sensor-picker" aria-labelledby="sensor-picker-title">
  <form method="dialog" class="picker-form">
    <h2 id="sensor-picker-title">Add a widget</h2>
    <div class="picker-search-row">
      <label class="sr-only" for="picker-search">Search sensors</label>
      <input id="picker-search" type="search" placeholder="Search by name, hardware, role or id">
      <button type="button" id="picker-role-only" class="btn btn-toggle" aria-pressed="false">Only sensors with a role</button>
    </div>
    <div id="picker-hardware-chips" class="chip-row" role="group" aria-label="Filter by hardware kind"></div>
    <div id="picker-type-chips" class="chip-row" role="group" aria-label="Filter by sensor type"></div>
    <div id="picker-results" class="picker-results" role="listbox" aria-label="Matching sensors"></div>
    <div id="picker-kind-step" class="picker-kind-step" hidden>
      <p id="picker-kind-label">Add as:</p>
      <div id="picker-kind-choices" class="chip-row" role="group" aria-labelledby="picker-kind-label"></div>
    </div>
    <div class="picker-actions">
      <button type="button" id="picker-cancel" class="btn">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="preset-name-dialog" aria-labelledby="preset-name-title">
  <form method="dialog" class="preset-dialog-form">
    <h2 id="preset-name-title">Preset name</h2>
    <label for="preset-name-input">Name</label>
    <input id="preset-name-input" type="text" maxlength="100" required>
    <div class="picker-actions">
      <button type="button" id="preset-name-cancel" class="btn">Cancel</button>
      <button type="submit" id="preset-name-submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="preset-delete-dialog" aria-labelledby="preset-delete-title">
  <form method="dialog" class="preset-dialog-form">
    <h2 id="preset-delete-title">Delete preset?</h2>
    <p id="preset-delete-message"></p>
    <div class="picker-actions">
      <button type="button" id="preset-delete-cancel" class="btn">Cancel</button>
      <button type="submit" id="preset-delete-confirm" class="btn btn-danger">Delete</button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/app.js"></script>
</body>
</html>
